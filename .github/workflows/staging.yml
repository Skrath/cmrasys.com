name: Hugo

on: 
  push:
    branches:
      - 'staging'

permissions:
  contents: read

jobs:
  staging-build:
    runs-on: ubuntu-latest
    environment: 
      name: Staging
      url: https://staging.cmrasys.com

    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup Hugo
      uses: peaceiris/actions-hugo@v3
      with:
        hugo-version: '0.167.0'
        extended: true

    - name: Install Dart Sass
      run: |
        curl -fsSL https://github.com/sass/dart-sass/releases/download/1.105.1/dart-sass-1.105.1-linux-x64.tar.gz -o "$RUNNER_TEMP/dart-sass.tar.gz"
        tar -xzf "$RUNNER_TEMP/dart-sass.tar.gz" -C "$RUNNER_TEMP"
        echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"
        
    - name: Build Hugo Site
      run: hugo -s hugo/ --minify --environment staging

    - name: FTP Upload
      uses: SamKirkland/FTP-Deploy-Action@v4.4.0
      with:
        server: ftp.cmrasys.com
        server-dir: cmrasys-staging/
        username: cmrasys
        password: ${{ secrets.FTP_PASSWORD }}
        local-dir: ./hugo/public/
        protocol: ftp
