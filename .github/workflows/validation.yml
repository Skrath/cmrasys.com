name: Validation

on:
  push:
  pull_request:

jobs:
  linters:
      name: Linters
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v7
        - name: Setup Node.js
          uses: actions/setup-node@v7
          with:
            node-version: '18'
        - name: Cache NPM
          uses: actions/cache@v6
          with:
            path: ~/.npm
            key: ${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
            restore-keys: |
              ${{ runner.os }}-npm-
        - name: Install stylelint deps
          run: npm install stylelint postcss stylelint-config-standard-scss -D --no-audit --no-fund
        - name: Stylelint
          uses: reviewdog/action-stylelint@v1
          with:
            reporter: github-check
            stylelint_input: "hugo/assets/sass/*.scss"

  site-build:
    name: Hugo build
    needs: linters
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: 'latest'
          extended: true

      - name: Install Dart Sass
        run: |
          curl -fsSL https://github.com/sass/dart-sass/releases/download/1.105.1/dart-sass-1.105.1-linux-x64.tar.gz -o "$RUNNER_TEMP/dart-sass.tar.gz"
          tar -xzf "$RUNNER_TEMP/dart-sass.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/dart-sass" >> "$GITHUB_PATH"

      - name: Build Hugo Site
        run: hugo -s hugo/ --minify
